<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON Host</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --txt:#e8eaf0; --mut:#8b92a5; --acc:#5b8cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; }
  main { max-width:820px; margin:0 auto; padding:40px 20px; }
  h1 { margin:0 0 6px; } .sub { color:var(--mut); margin:0 0 28px; }
  .item { background:var(--card); border-radius:10px; padding:16px; margin-bottom:16px; }
  .head { display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:10px; }
  .head h3 { margin:0; } .head small { color:var(--mut); font-family:monospace; }
  pre { margin:0; background:#0f1115; border-radius:8px; padding:14px; overflow:auto; max-height:420px; font-size:13px; line-height:1.5; }
  .k { color:#7aa2ff; } .s { color:#8fd19e; } .n { color:#f0b46c; } .b { color:#d58cf0; }
  button, a.btn { background:var(--acc); color:#fff; border:0; border-radius:6px; padding:7px 11px; cursor:pointer; font-size:13px; text-decoration:none; }
  a.btn.sec, button.sec { background:#2a2f3a; }
</style>
</head>
<body>
<main>
  <h1 id="t">JSON Host</h1>
  <p class="sub" id="st"></p>
  <div id="list">Carregando...</div>
</main>
<script>
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function highlight(json) {
  return esc(json).replace(/("(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, (m) => {
    let c = 'n';
    if (/^"/.test(m)) c = /:$/.test(m) ? 'k' : 's';
    else if (/true|false|null/.test(m)) c = 'b';
    return '<span class="' + c + '">' + m + '</span>';
  });
}
fetch('/api/public').then((r) => r.json()).then(({ settings, items }) => {
  document.getElementById('t').textContent = settings.siteTitle;
  document.title = settings.siteTitle;
  document.getElementById('st').textContent = settings.siteSubtitle;
  const list = document.getElementById('list'); list.textContent = '';
  if (!items.length) { list.textContent = 'Nenhum JSON público ainda.'; return; }
  items.forEach((i) => {
    let pretty = i.content;
    try { pretty = JSON.stringify(JSON.parse(i.content), null, 2); } catch {}
    const box = document.createElement('div'); box.className = 'item';
    const head = document.createElement('div'); head.className = 'head';
    const left = document.createElement('div');
    const h = document.createElement('h3'); h.textContent = i.title;
    const sm = document.createElement('small'); sm.textContent = '/j/' + i.slug;
    left.append(h, sm);
    const act = document.createElement('div');
    const cp = document.createElement('button'); cp.textContent = 'Copiar JSON';
    cp.onclick = () => { navigator.clipboard.writeText(pretty); cp.textContent = 'Copiado!'; setTimeout(() => cp.textContent = 'Copiar JSON', 1500); };
    const raw = document.createElement('a'); raw.className = 'btn sec'; raw.href = '/j/' + i.slug; raw.target = '_blank'; raw.textContent = 'Abrir raw';
    act.append(cp, ' ', raw);
    head.append(left, act);
    const pre = document.createElement('pre'); pre.innerHTML = highlight(pretty);
    box.append(head, pre); list.append(box);
  });
});
</script>
</body>
</html>
